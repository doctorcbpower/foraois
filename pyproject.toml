[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foraois"

version = "0.1.0"

requires-python = ">=3.11"

dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
    "matplotlib",
]

description = "Monte Carlo dark-matter halo merger trees (fitted-rate and exact/constrained-excursion algorithms) for CDM, WDM and FDM cosmologies"

readme = { file = "README.md", content-type = "text/markdown" }

authors = [
  { name = "Chris Power", email = "chris.power@uwa.edu.au" }
]

license = { text = "MIT" }

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]

keywords = [
    "astronomy",
    "cosmology",
    "dark matter",
    "merger trees",
    "structure formation",
    "Monte Carlo",
]

[project.optional-dependencies]
class = ["classy"]
camb = ["camb"]
numba = ["numba"]
paper = ["SciencePlots"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "pre-commit",
    "ruff",
    "build",
    "twine",
    "numba",
]

[project.scripts]
foraois-run = "foraois.main:main"

[project.urls]
Homepage = "https://github.com/doctorcbpower/foraois"
Repository = "https://github.com/doctorcbpower/foraois"
Issues = "https://github.com/doctorcbpower/foraois/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

ignore = [
    "TRY004",
    "E731",
]

[tool.ruff.format]
exclude = ["*.md", "*.ipynb"]
