Run:
  mode: camb
  pk_kmin: 1.e-4
  pk_kmax: 1.e2
  pk_npoints: 2000
  plot_pk: False
  plot_mvar: False
  pk_file_name: camb_pk
  mvar_file_name: camb_mvar
  use_spherical_bessel: False  # Use spherical bessel function for top-hat filter

  # Non-standard dark matter: 'cdm' (default, if omitted) leaves P(k)
  # untouched; 'wdm' multiplies it by transfer_functions.T_WDM(k,
  # dm_model_mass, ...)^2 -- see that module's docstring for the exact
  # fitting formula (Viel et al. 2005) and its k < 5 h/Mpc calibration
  # range. dm_model_mass is the thermal-relic WDM particle mass in keV.
  dm_model: wdm
  dm_model_mass: 3.0

Cosmology:
  H0: 67.556
  OmegaBar: 0.048275
  OmegaM: 0.3120456
  OmegaK: 0.0
  As: 2.215e-9
  ns: 0.9619
  tau_reio: 0.0925
  mnu: 0.0

class:
  output: mPk
  P_k_max_1/Mpc: 1000.

camb:

user:
