name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: |
          python -m build

      - name: Check distributions
        run: |
          twine check dist/*

      - name: Install built wheel and verify import (outside the repo checkout)
        run: |
          python -m venv /tmp/wheel-install-test
          /tmp/wheel-install-test/bin/pip install --upgrade pip
          /tmp/wheel-install-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-install-test/bin/python -c "
          import foraois
          from foraois import CosmoData, PCHMergerTree, ZhangHuiMergerTree, build_constrained_tree
          print('import ok:', foraois.__all__)
          "
          /tmp/wheel-install-test/bin/foraois-run --help

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
