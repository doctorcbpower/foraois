name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Bounds of the supported range (pyproject.toml's requires-python)
        # -- a pure-Python wheel doesn't vary by interpreter, so this
        # checks "does build+install+import work on both ends," not "does
        # every version produce a different artifact." ci.yml's full
        # 3.11-3.13 x 3-OS matrix is what actually exercises the code.
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: |
          python -m build

      - name: Check distributions
        run: |
          twine check dist/*

      - name: Install built wheel and verify import (outside the repo checkout)
        run: |
          python -m venv /tmp/wheel-install-test
          /tmp/wheel-install-test/bin/pip install --upgrade pip
          /tmp/wheel-install-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-install-test/bin/python -c "
          import foraois
          from foraois import CosmoData, PCHMergerTree, ZhangHuiMergerTree, build_constrained_tree
          print('import ok:', foraois.__all__)
          "
          /tmp/wheel-install-test/bin/foraois-run --help

      - name: Upload artifacts
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
